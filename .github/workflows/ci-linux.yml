name: CI (Linux)

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: .fcache
          key: ${{ matrix.os }}-fcache-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ matrix.os }}-fcache-

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm \
            linux-tools-common \
            libbpf-dev libelf-dev zlib1g-dev \
            cmake ninja-build pkg-config \
            python3
          if ! command -v bpftool >/dev/null 2>&1 && [ ! -x /usr/sbin/bpftool ] && [ ! -x /usr/bin/bpftool ]; then
            echo "ERROR: bpftool is required but was not installed."
            echo "Hint: check which packages provide it with: apt-cache showpkg bpftool"
            exit 1
          fi

      - name: Collect system info
        run: |
          set -euxo pipefail
          mkdir -p ci_logs
          git rev-parse HEAD | tee ci_logs/git_head.txt
          uname -a | tee ci_logs/uname.txt
          cat /etc/os-release | tee ci_logs/os-release.txt
          id | tee ci_logs/id.txt
          clang --version | tee ci_logs/clang.txt
          echo 'int x;' | clang -v -E -target bpf -x c - 2>&1 | tee ci_logs/clang_bpf_includes.txt
          pkg-config --modversion libbpf | tee ci_logs/libbpf_pkgconfig_version.txt || true
          dpkg -l | grep -E 'libbpf|linux-tools|bpftool' | tee ci_logs/dpkg_libbpf_linux_tools.txt || true
          if [ -f /usr/include/bpf/libbpf.h ]; then
            ls -la /usr/include/bpf/libbpf.h | tee ci_logs/libbpf_h_ls.txt
            wc -l /usr/include/bpf/libbpf.h | tee ci_logs/libbpf_h_wc.txt

            # Make perf buffer API drift debuggable (portable: no ripgrep required).
            grep -n "struct perf_buffer_opts" /usr/include/bpf/libbpf.h \
              | tee ci_logs/libbpf_perf_buffer_opts.txt || true
            grep -n "perf_buffer__new" /usr/include/bpf/libbpf.h \
              | tee ci_logs/libbpf_perf_buffer_new.txt || true

            # When compiler errors reference fixed line numbers (e.g. :683, :1480), these excerpts are immediately useful.
            nl -ba /usr/include/bpf/libbpf.h | sed -n '640,720p' \
              | tee ci_logs/libbpf_h_excerpt_640_720.txt || true
            nl -ba /usr/include/bpf/libbpf.h | sed -n '1460,1525p' \
              | tee ci_logs/libbpf_h_excerpt_1460_1525.txt || true
          else
            echo "ERROR: /usr/include/bpf/libbpf.h not found" | tee ci_logs/libbpf_h_missing.txt
          fi
          cat /proc/sys/kernel/unprivileged_bpf_disabled | tee ci_logs/unprivileged_bpf_disabled.txt || true
          cat /proc/sys/kernel/yama/ptrace_scope | tee ci_logs/ptrace_scope.txt || true
          bpftool version | tee ci_logs/bpftool_version.txt
          sudo bpftool feature probe 2>&1 | tee ci_logs/bpftool_feature_probe.txt || true
          ls -la /sys/kernel/btf/vmlinux | tee ci_logs/kernel_btf.txt

      - name: Configure
        run: |
          set -euxo pipefail
          cmake -S . -B build_ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRPD_FETCH_DEPS=ON \
            -DRPD_BUILD_TOOLS=ON \
            -DRPD_BUILD_EXPERIMENTS=ON \
            -DBUILD_TESTING=ON \
            -DFETCHCONTENT_BASE_DIR=.fcache \
            2>&1 | tee ci_logs/cmake_configure.log

      - name: Build
        run: |
          set -euxo pipefail
          {
            echo "=== libbpf perf buffer API (grep) ==="
            cat ci_logs/libbpf_perf_buffer_opts.txt || true
            cat ci_logs/libbpf_perf_buffer_new.txt || true
            echo "=== libbpf.h excerpts ==="
            cat ci_logs/libbpf_h_excerpt_640_720.txt || true
            cat ci_logs/libbpf_h_excerpt_1460_1525.txt || true
            echo "=== build ==="
            cmake --build build_ci -j --verbose
          } 2>&1 | tee ci_logs/build.log

      - name: Run unit tests (root)
        run: |
          set -euxo pipefail
          rc=0
          sudo ./build_ci/tests/runTests \
            --gtest_color=yes \
            --gtest_output=xml:ci_logs/gtest.xml \
            2>&1 | tee ci_logs/runTests.log || rc=$?
          if [ -f application.log ]; then
            echo "=== application.log (from unit tests) ===" | tee -a ci_logs/runTests.log
            sudo cat application.log | tee -a ci_logs/runTests.log
            sudo cat application.log > ci_logs/application_from_tests.log
          fi
          if [ -f scan_results.json ]; then
            sudo cat scan_results.json > ci_logs/scan_results_from_tests.json
          fi
          sudo dmesg | tail -n 200 | tee ci_logs/dmesg_tail_after_tests.txt || true
          exit "$rc"

      - name: E2E demo (realtime_detection + memory scan + JSON)
        run: |
          set -euxo pipefail
          rm -f scan_results.json application.log

          WATCH_PREFIX="$(realpath build_ci/tools)"
          TARGET_PROCESS="$(realpath build_ci/tools/target_process)"

          sudo ./build_ci/src/realtime_detection \
            --watch-prefix "$WATCH_PREFIX" \
            --pattern "i am a shellcode" \
            --workers 2 \
            --scan-delay-ms 200 \
            --max-events 1 \
            --timeout-ms 15000 \
            > ci_logs/realtime_detection.log 2>&1 &
          DET_PID=$!

          # Ensure the detector is ready before triggering exec.
          sleep 0.5

          "$TARGET_PROCESS" \
            --alloc-mb 32 \
            --sleep-ms 8000 \
            --pattern "i am a shellcode" \
            > ci_logs/target_process.log 2>&1 &
          TARGET_PID=$!

          if ! wait "$DET_PID"; then
            echo "ERROR: realtime_detection exited non-zero"
            tail -n 200 ci_logs/realtime_detection.log || true
            sudo dmesg | tail -n 200 | tee ci_logs/dmesg_tail_after_e2e_failure.txt || true
            exit 1
          fi
          if ! wait "$TARGET_PID"; then
            echo "ERROR: target_process exited non-zero"
            tail -n 200 ci_logs/target_process.log || true
            exit 1
          fi

          ls -la scan_results.json application.log | tee ci_logs/e2e_outputs.txt
          sudo cat application.log > ci_logs/application_from_e2e.log
          sudo cat scan_results.json > ci_logs/scan_results_from_e2e.json
          echo "=== application.log (from E2E) ===" | tee -a ci_logs/realtime_detection.log
          sudo cat application.log | tee -a ci_logs/realtime_detection.log || true
          export EXPECTED_TARGET_PATH="$TARGET_PROCESS"
          export EXPECTED_TARGET_PID="$TARGET_PID"
          export EXPECTED_TARGET_UID="$(id -u)"
          export EXPECTED_TARGET_GID="$(id -g)"
          python3 - <<'PY' | tee ci_logs/e2e_scan_results_parsed.txt
          import json
          import os
          with open("ci_logs/scan_results_from_e2e.json", "r") as f:
              obj = json.load(f)
          for k in ("pid", "uid", "gid", "comm", "filePath"):
              if k not in obj:
                  raise SystemExit(f"missing key: {k}")
          if not isinstance(obj["pid"], int) or obj["pid"] <= 0:
              raise SystemExit(f"invalid pid: {obj['pid']}")
          expected_path = os.environ.get("EXPECTED_TARGET_PATH")
          expected_pid = int(os.environ.get("EXPECTED_TARGET_PID", "0"))
          expected_uid = int(os.environ.get("EXPECTED_TARGET_UID", "-1"))
          expected_gid = int(os.environ.get("EXPECTED_TARGET_GID", "-1"))
          if expected_path and obj["filePath"] != expected_path:
              raise SystemExit(f"unexpected filePath: got={obj['filePath']} expected={expected_path}")
          if expected_pid and obj["pid"] != expected_pid:
              raise SystemExit(f"unexpected pid: got={obj['pid']} expected={expected_pid}")
          if expected_uid >= 0 and obj["uid"] != expected_uid:
              raise SystemExit(f"unexpected uid: got={obj['uid']} expected={expected_uid}")
          if expected_gid >= 0 and obj["gid"] != expected_gid:
              raise SystemExit(f"unexpected gid: got={obj['gid']} expected={expected_gid}")
          if os.path.basename(str(obj["filePath"])) != "target_process":
              raise SystemExit(f"unexpected basename(filePath)={os.path.basename(str(obj['filePath']))}")
          if "target_process" not in str(obj["comm"]):
              raise SystemExit(f"unexpected comm={obj['comm']}")
          print(obj)
          PY

      - name: Multi-thread benchmark (eBPF + scan)
        run: |
          set -euxo pipefail
          sudo ./build_ci/experiments/ebpf_scan_bench \
            --workers 1 \
            --processes 8 \
            --alloc-mb 64 \
            --scan-delay-ms 200 \
            --timeout-ms 30000 \
            --no-json \
            2>&1 | tee ci_logs/bench_workers_1.log

          sudo ./build_ci/experiments/ebpf_scan_bench \
            --workers 4 \
            --processes 8 \
            --alloc-mb 64 \
            --scan-delay-ms 200 \
            --timeout-ms 30000 \
            --no-json \
            2>&1 | tee ci_logs/bench_workers_4.log

      - name: Benchmark summary
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee ci_logs/bench_summary.txt
          import pathlib
          import re
          
          def parse_elapsed_ms(path: str):
              text = pathlib.Path(path).read_text()
              m = re.search(r"elapsed_ms=(\d+)", text)
              return int(m.group(1)) if m else None
          
          t1 = parse_elapsed_ms("ci_logs/bench_workers_1.log")
          t4 = parse_elapsed_ms("ci_logs/bench_workers_4.log")
          speedup = (t1 / t4) if (t1 and t4 and t4 > 0) else None
          
          print({
              "elapsed_ms_workers_1": t1,
              "elapsed_ms_workers_4": t4,
              "speedup_1_over_4": speedup,
          })
          PY

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}
          path: |
            ci_logs
            build_ci/CMakeCache.txt
